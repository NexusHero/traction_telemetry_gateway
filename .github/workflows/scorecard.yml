name: Scorecard

# OpenSSF Scorecard grades the repository's own supply-chain hygiene - pinned
# dependencies, token permissions, branch protection, signed releases, fuzzing,
# SAST, dangerous workflow patterns - against the same checks it runs on
# thousands of open-source projects. It is a report, not a gate: the score is
# published (badge in the README) and the findings land in GitHub code scanning
# as SARIF, next to CodeQL's.
#
# Publishing restricts what this workflow may contain: no workflow-level env
# or defaults, no containers, and only the actions used below.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'         # weekly
  branch_protection_rule:        # the Branch-Protection check reads these
  workflow_dispatch:
  # Experimental upstream; runs without publishing so a change to this file
  # is exercised before it reaches main.
  pull_request:
    paths:
      - .github/workflows/scorecard.yml

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write     # upload SARIF to code scanning
      id-token: write            # publish results (badge, scorecard.dev API)
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif

      - name: Upload to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
