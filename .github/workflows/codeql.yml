name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * 1'   # weekly
  workflow_dispatch:

permissions:
  contents: read

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  analyze:
    name: CodeQL analysis (C++)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Set up Conan
        uses: $/.github/actions/setup-conan

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-codeql-${{ hashFiles('conanfile.py', 'conan.lock') }}

      - name: Install dependencies
        run: |
          conan install . --build=missing -of build -s build_type=Release

      - name: Build (CodeQL traced)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          cmake --build build --parallel

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
