name: Supply chain

on:
  workflow_call:
    secrets:
      CONAN_AUDIT_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  sbom-and-scan:
    name: SBOM + dependency CVE & licence gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Conan
        uses: $/.github/actions/setup-conan

      - name: Resolve dependency graph (conan.lock)
        run: |
          conan install . --build=missing -of build -s build_type=Release --lockfile=conan.lock --lockfile-out=build/conan.lock

      - name: Generate SBOM (CycloneDX)
        run: ./scripts/sbom.sh -o build/sbom.cdx.json

      - name: Licence policy gate
        run: python scripts/license_check.py --json-out build/licenses.json

      - name: Authenticate CVE provider
        id: auth
        env:
          CONAN_AUDIT_TOKEN: ${{ secrets.CONAN_AUDIT_TOKEN }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if [ -n "$CONAN_AUDIT_TOKEN" ]; then
            conan audit provider auth conancenter --token="$CONAN_AUDIT_TOKEN"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning::CONAN_AUDIT_TOKEN unavailable to fork PRs - CVE gate skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CONAN_AUDIT_TOKEN is not set. Register at https://conan.io/audit/register and add it as the repository secret CONAN_AUDIT_TOKEN."
            exit 1
          fi

      - name: Scan dependencies for CVEs (gate = high)
        if: steps.auth.outputs.enabled == 'true'
        run: |
          conan audit scan . --context host --severity-level 7.0 -s build_type=Release -f json --out-file build/conan-audit.json

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          for file in build/sbom.cdx.json build/conan.lock build/conan-audit.json build/licenses.json; do
            [ -f "$file" ] && cp "$file" evidence/
          done
          ls -la evidence/

      - name: Upload SBOM and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-evidence
          path: evidence/
          if-no-files-found: ignore

  container:
    name: Container build, scan & sign
    runs-on: ubuntu-24.04
    needs: sbom-and-scan
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dependency evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-evidence
          path: evidence

      - name: Stage the lockfile into the build context
        run: |
          if [ ! -f evidence/conan.lock ]; then
            echo "::error::conan.lock missing from the evidence artefact - refusing to build an unpinned image."
            exit 1
          fi
          cp evidence/conan.lock ./conan.lock
          echo "Image will be built from:"
          head -20 conan.lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build image (load)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ttg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install trivy and grype
        uses: $/.github/actions/install-scanners

      - name: Scan image (gate = high)
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed ttg:ci

      - name: Scan image with grype (gate = high)
        run: |
          mkdir -p evidence
          grype ttg:ci --only-fixed --fail-on high \
            -o table -o json=evidence/grype-image.json

      - name: Generate image SBOM (CycloneDX)
        run: |
          mkdir -p evidence
          trivy image --format cyclonedx --output evidence/image-sbom.cdx.json ttg:ci
          echo "image SBOM components: $(python -c "import json;print(len(json.load(open('evidence/image-sbom.cdx.json')).get('components',[])))")"

      - name: DAST - ZAP API scan (gate = any unaccepted warning)
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          printf '%s' "$token" > "$RUNNER_TEMP/dast-token"

          docker network create dast
          docker run -d --name ttg --network dast -p 127.0.0.1:8080:8080 \
            -e TTG_INGEST_TOKEN="$token" ttg:ci

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/readyz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/readyz >/dev/null || {
            echo "::error::gateway did not become ready"; docker logs ttg; exit 1;
          }

          mkdir -p zap
          cp docs/openapi.yaml .zap/rules.tsv zap/
          chmod -R a+rwX zap

          set +e
          docker run --rm --network dast -v "$PWD/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER_VALUE="Bearer $token" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2 \
            zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi \
              -O http://ttg:8080 -c rules.tsv \
              -J zap-report.json -r zap-report.html -s
          status=$?
          set -e

          mkdir -p evidence
          cp zap/zap-report.json zap/zap-report.html evidence/ 2>/dev/null || true

          if [ "$(docker inspect -f '{{.State.Running}}' ttg)" != "true" ]; then
            echo "::error::the gateway died during the DAST scan"
            docker logs ttg
            exit 1
          fi

          case "$status" in
            0) echo "ZAP: no findings beyond .zap/rules.tsv" ;;
            1|2) echo "::error::ZAP reported findings - see zap-report.html in the image-evidence artefact"; exit 1 ;;
            *) echo "::error::ZAP failed to run (exit $status)"; exit 1 ;;
          esac

      - name: API contract fuzzing - Schemathesis (gate = any failure)
        run: |
          mkdir -p evidence
          chmod a+rwx evidence
          token=$(cat "$RUNNER_TEMP/dast-token")
          docker run --rm --network dast \
            -v "$PWD:/w:ro" -v "$PWD/evidence:/out" -w /tmp \
            schemathesis/schemathesis:4.30.0@sha256:bb9cecfc9ac4058a15fcf9b505d9d9f972e2dde7c74c4e9289a35922f4cbc0a5 \
            --config-file /w/schemathesis.toml \
            run /w/docs/openapi.yaml --url http://ttg:8080 \
            --header "Authorization: Bearer $token" \
            --report junit --report-junit-path /out/schemathesis-junit.xml

          if [ "$(docker inspect -f '{{.State.Running}}' ttg)" != "true" ]; then
            echo "::error::the gateway died during the Schemathesis run"
            docker logs ttg
            exit 1
          fi

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence
          path: |
            evidence/image-sbom.cdx.json
            evidence/grype-image.json
            evidence/zap-report.json
            evidence/zap-report.html
            evidence/schemathesis-junit.xml
          if-no-files-found: ignore

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Push, sign and attest (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digest=""
          for tag in $TAGS; do
            docker tag ttg:ci "$tag"
            docker push "$tag"

            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$tag" | cut -d@ -f2)
            ref="${tag%%:*}@${digest}"
            echo "signing $ref"

            cosign sign --yes "$ref"

            cosign attest --yes --type cyclonedx \
              --predicate evidence/image-sbom.cdx.json "$ref"
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verification instructions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="${IMAGE}@${DIGEST}"
          {
            echo '### Signed image'
            echo ''
            echo '```sh'
            echo "# signature"
            echo "cosign verify $image \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo ''
            echo "# SBOM attestation"
            echo "cosign verify-attestation $image --type cyclonedx \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo ''
            echo "# build provenance"
            echo "gh attestation verify oci://$image -R ${{ github.repository }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
