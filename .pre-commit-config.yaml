repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/corpus/
      - id: end-of-file-fixer
        exclude: ^tests/corpus/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(tests/corpus/|scripts/.*\.ps1$)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=256]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-case-conflict

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.4
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|h|hpp)$

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (skipped without build/compile_commands.json)
        entry: scripts/clang_tidy_hook.sh
        language: script
        files: ^(src|include)/.*\.(cpp|hpp)$
        require_serial: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
