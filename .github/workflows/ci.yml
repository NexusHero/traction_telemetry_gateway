name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  format:
    name: Format (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19
          sudo update-alternatives --install /usr/bin/clang-format clang-format \
            /usr/bin/clang-format-19 100

      - name: Check formatting
        run: |
          clang-format --version
          find src include tests benchmarks -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Show the required diff
        if: failure()
        run: |
          find src include tests benchmarks -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format -i
          git diff --color=always
          echo "::error::Run 'pre-commit run --all-files' (or clang-format -i) and commit the result."

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Conan
        uses: $/.github/actions/setup-conan

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan.lock') }}

      - name: Install dependencies
        run: conan install . --build=missing -of build -s build_type=${{ env.BUILD_TYPE }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          -DTTG_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          set -o pipefail
          mkdir -p evidence
          ctest --test-dir build --output-on-failure 2>&1 | tee evidence/ctest.txt

      - name: Verify exploit mitigations
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          scripts/check_hardening.sh build/ttg_server build/ttg_tests | tee evidence/hardening.txt

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-build-${{ matrix.os }}
          path: evidence/
          if-no-files-found: ignore

  cross-aarch64:
    name: Cross build & test (aarch64, qemu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Conan
        uses: $/.github/actions/setup-conan

      - name: Install cross toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13-aarch64-linux-gnu qemu-user

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-armv8-${{ hashFiles('conanfile.py', 'conan.lock', 'ci/conan/linux-armv8-gcc13') }}

      - name: Install dependencies (host = armv8, build = runner)
        run: >
          conan install . --build=missing -of build
          -pr:h ci/conan/linux-armv8-gcc13 -pr:b default
          --lockfile=conan.lock

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-aarch64;-L;/usr/aarch64-linux-gnu"
          -DTTG_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify the binary is AArch64
        run: |
          file build/ttg_server
          readelf -h build/ttg_server | grep -q 'Machine:.*AArch64'

      - name: Test (qemu-aarch64)
        run: |
          set -o pipefail
          mkdir -p evidence
          ctest --test-dir build --output-on-failure 2>&1 | tee evidence/ctest.txt

      - name: Verify exploit mitigations
        run: |
          set -o pipefail
          scripts/check_hardening.sh build/ttg_server build/ttg_tests | tee evidence/hardening.txt

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-cross-aarch64
          path: evidence/
          if-no-files-found: ignore

  sanitize:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            label: ASan / UBSan
            options: 'UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1'
          - sanitizer: thread
            label: TSan
            options: 'TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1'
            conan_options: '-o "cpp-httplib/*:use_non_blocking_getaddrinfo=False"'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Conan
        uses: $/.github/actions/setup-conan

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-san-${{ matrix.sanitizer }}-${{ hashFiles('conanfile.py', 'conan.lock') }}

      - run: conan install . --build=missing -of build -s build_type=Debug ${{ matrix.conan_options }}

      - name: Configure (TTG_SANITIZER=${{ matrix.sanitizer }})
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          -DTTG_SANITIZER=${{ matrix.sanitizer }}
          -DTTG_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests under ${{ matrix.label }}
        run: |
          set -o pipefail
          mkdir -p evidence
          ${{ matrix.options }} ctest --test-dir build --output-on-failure 2>&1 | tee evidence/ctest.txt

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-sanitize-${{ matrix.sanitizer }}
          path: evidence/
          if-no-files-found: ignore

  coverage:
    name: Coverage (gcovr)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Conan
        uses: $/.github/actions/setup-conan

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-coverage-${{ hashFiles('conanfile.py', 'conan.lock') }}

      - run: conan install . --build=missing -of build -s build_type=Debug

      - name: Configure (instrumented)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          -DTTG_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Report coverage
        run: |
          mkdir -p coverage
          gcovr --root . \
            --filter 'src/' --filter 'include/' \
            --exclude-unreachable-branches \
            --print-summary \
            --txt coverage/coverage.txt \
            --xml-pretty --output coverage/coverage.xml \
            --html-details coverage/coverage.html
          {
            echo '### Coverage'
            echo ''
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  static-analysis:
    name: SAST (clang-tidy + cppcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Conan
        uses: $/.github/actions/setup-conan

      - name: Install analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 cppcheck

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-sast-${{ hashFiles('conanfile.py', 'conan.lock') }}

      - run: conan install . --build=missing -of build -s build_type=${{ env.BUILD_TYPE }}

      - name: Configure (export compile commands)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy
        run: |
          set +e
          clang-tidy-18 -p build src/*.cpp 2>&1 | tee clang-tidy.txt
          status=${PIPESTATUS[0]}
          echo "clang-tidy exit status: $status"
          if [ "$status" -gt 1 ]; then
            echo "::error::clang-tidy failed to run (exit $status)"
            exit "$status"
          fi

      - name: cppcheck
        run: |
          set +e
          cppcheck --enable=warning,performance,portability \
            --suppress=missingIncludeSystem --std=c++20 \
            --inline-suppr -I include src include \
            --template='{file}:{line}:{column}: {severity}: {message} [{id}]' \
            2>&1 | tee cppcheck.txt
          status=${PIPESTATUS[0]}
          echo "cppcheck exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::cppcheck failed to run (exit $status)"
            exit "$status"
          fi

      - name: Gate on new findings
        run: |
          set -o pipefail
          python scripts/sast_gate.py check \
            --baseline .sast-baseline.txt \
            clang-tidy.txt cppcheck.txt | tee sast-gate.txt

      - name: Upload analyzer reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis-reports
          path: |
            clang-tidy.txt
            cppcheck.txt
            sast-gate.txt
          if-no-files-found: ignore

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-audit:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false

  fuzz-smoke:
    name: Fuzz smoke (libFuzzer, 60s)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev

      - name: Build fuzzer
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DTTG_BUILD_SERVER=OFF \
            -DTTG_BUILD_TESTS=OFF \
            -DTTG_ENABLE_FUZZING=ON
          cmake --build build-fuzz --target fuzz_frame_parser

      - name: Restore fuzzing corpus (from the nightly run)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Fuzz for 60 seconds
        run: |
          set -o pipefail
          mkdir -p fuzz-corpus artifacts evidence
          cp tests/corpus/* fuzz-corpus/
          ./build-fuzz/fuzz_frame_parser fuzz-corpus/ \
            -max_total_time=60 -print_final_stats=1 -artifact_prefix=artifacts/ \
            2>&1 | tee evidence/fuzz-smoke.txt

      - name: Upload fuzzing evidence and crash reproducers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-fuzz-smoke
          path: |
            evidence/
            artifacts/
          if-no-files-found: ignore
