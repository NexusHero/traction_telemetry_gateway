name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  benchmark:
    name: Runtime & allocation benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Conan
        uses: $/.github/actions/setup-conan

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-bench-${{ hashFiles('conanfile.py', 'conan.lock') }}

      - name: Install dependencies
        run: |
          conan install . --build=missing -of build -s build_type=Release -o build_benchmarks=True --lockfile-partial

      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DTTG_BUILD_BENCHMARKS=ON
          cmake --build build --target ttg_benchmarks

      - name: Run benchmarks
        run: |
          ./build/ttg_benchmarks \
            --benchmark_min_time=0.05s \
            --benchmark_format=json \
            --benchmark_out=benchmarks.json \
            --benchmark_report_aggregates_only=true \
            | tee benchmarks.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            benchmarks.json
            benchmarks.txt
          if-no-files-found: ignore
