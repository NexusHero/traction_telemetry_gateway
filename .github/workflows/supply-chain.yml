name: Supply chain

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; the write scopes are granted to the one job that
# publishes and signs. sbom-and-scan runs third-party tooling (Conan recipes,
# the sbom extension) and has no reason to hold a token that can push images.
permissions:
  contents: read

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  # ---------------------------------------------------------------------------
  # Stage 4 + 7. Resolves the graph once and produces every artefact that
  # describes it: the lockfile, the SBOM, the CVE verdict and the licence
  # verdict. The container job consumes the same lockfile, so the image is
  # provably built from the graph that was scanned here.
  # ---------------------------------------------------------------------------
  sbom-and-scan:
    name: SBOM + dependency CVE & licence gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Conan
        uses: $/.github/actions/setup-conan

      # No Conan cache here. This job's lockfile and SBOM are what the image
      # is built from and what gets attested on tags, so a poisoned cache entry
      # would end up signed. Both dependencies are header-only and the sbom
      # extension is a small download, so a cold start costs seconds.
      - name: Resolve dependency graph (conan.lock)
        run: |
          conan install . --build=missing -of build -s build_type=Release --lockfile=conan.lock --lockfile-out=build/conan.lock

      # Generated from the Conan graph via the official conan-extensions
      # command - the same script developers run locally, so the SBOM in a
      # release artefact and the one on a dev machine are produced identically.
      - name: Generate SBOM (CycloneDX)
        run: ./scripts/sbom.sh -o build/sbom.cdx.json

      # Stage 4's other half. A CVE is a bug you can patch; a copyleft
      # obligation you shipped unknowingly is not fixable after the fact, so the
      # licence policy is a gate rather than a report. Default-deny, and an
      # undeclared licence counts as a violation.
      - name: Licence policy gate
        run: python scripts/license_check.py --json-out build/licenses.json

      # The CVE gate deliberately does NOT read the SBOM above: the extension
      # emits package URLs but no CPEs, and CPE is what file-based scanners
      # match C/C++ packages on, so scanning it would pass unconditionally.
      # `conan audit` resolves CVEs against the Conan references themselves.
      #
      # The provider needs a (free) token from https://conan.io/audit/register,
      # which must be email-validated before it works. `provider auth` stores a
      # token without checking it, so an invalid one surfaces as a 403 in the
      # scan step below rather than here.
      #
      # Secrets are unavailable to pull requests from forks, where the gate is
      # skipped with a warning rather than failing on something the contributor
      # cannot fix. Anywhere else a missing token is a hard error: a silently
      # skipped gate is worse than no gate.
      - name: Authenticate CVE provider
        id: auth
        env:
          CONAN_AUDIT_TOKEN: ${{ secrets.CONAN_AUDIT_TOKEN }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if [ -n "$CONAN_AUDIT_TOKEN" ]; then
            conan audit provider auth conancenter --token="$CONAN_AUDIT_TOKEN"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning::CONAN_AUDIT_TOKEN unavailable to fork PRs - CVE gate skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CONAN_AUDIT_TOKEN is not set. Register at https://conan.io/audit/register and add it as the repository secret CONAN_AUDIT_TOKEN."
            exit 1
          fi

      # Default severity threshold is CVSS >= 9.0, i.e. critical only, matching
      # the trivy gate on the image below. --context host skips tool requires,
      # which never reach the runtime image.
      - name: Scan dependencies for CVEs (gate = critical)
        if: steps.auth.outputs.enabled == 'true'
        run: |
          conan audit scan . --context host --severity-level 9.0 -s build_type=Release -f json --out-file build/conan-audit.json

      # Collected into one directory so the uploaded artefact has a stable,
      # flat layout. upload-artifact strips the longest common prefix of its
      # inputs, which means the paths inside the artefact would otherwise
      # change depending on which optional files exist.
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          for file in build/sbom.cdx.json build/conan.lock build/conan-audit.json build/licenses.json; do
            [ -f "$file" ] && cp "$file" evidence/
          done
          ls -la evidence/

      - name: Upload SBOM and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-evidence
          path: evidence/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Stage 7 + 8. `needs:` is load-bearing in two ways: the image is built from
  # the lockfile the job above scanned, and an image whose dependencies failed
  # the CVE or licence gate is never built, let alone pushed.
  # ---------------------------------------------------------------------------
  container:
    name: Container build, scan & sign
    runs-on: ubuntu-24.04
    needs: sbom-and-scan
    permissions:
      contents: read
      packages: write          # publish image to GHCR
      id-token: write          # keyless signing
      attestations: write      # SLSA provenance via actions/attest-*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dependency evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dependency-evidence
          path: evidence

      # The Dockerfile reads conan.lock from the build context, so the image
      # resolves exactly the revisions that were scanned rather than whatever
      # ConanCenter serves at build time.
      - name: Stage the lockfile into the build context
        run: |
          if [ ! -f evidence/conan.lock ]; then
            echo "::error::conan.lock missing from the evidence artefact - refusing to build an unpinned image."
            exit 1
          fi
          cp evidence/conan.lock ./conan.lock
          echo "Image will be built from:"
          head -20 conan.lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}

      # Build into a fixed local tag so the scan below always has a target,
      # regardless of branch/tag (metadata tags differ between PR and push).
      - name: Build image (load)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ttg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Versions and SHA-256 hashes live in the composite action, shared with
      # cve-rescan.yml so the gate and the nightly rescan use the same scanners.
      - name: Install trivy and grype
        uses: $/.github/actions/install-scanners

      - name: Scan image (gate = critical)
        run: trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed ttg:ci

      # A second scanner on the same image, with the same threshold. trivy and
      # grype catalogue packages independently and match against different
      # advisory feeds, so a CVE one of them misses (a missing distro feed
      # entry, a cataloguer gap) the other often catches. Two gates that
      # agree cost seconds; a single scanner's blind spot is invisible.
      - name: Scan image with grype (gate = critical)
        run: |
          mkdir -p evidence
          grype ttg:ci --only-fixed --fail-on critical \
            -o table -o json=evidence/grype-image.json

      # Two SBOMs describe two different things and both matter. The Conan one
      # (from the job above) lists the libraries this project chose; this one
      # lists what is actually in the image, including the distroless base
      # layer, which no dependency manifest mentions.
      - name: Generate image SBOM (CycloneDX)
        run: |
          mkdir -p evidence
          trivy image --format cyclonedx --output evidence/image-sbom.cdx.json ttg:ci
          echo "image SBOM components: $(python -c "import json;print(len(json.load(open('evidence/image-sbom.cdx.json')).get('components',[])))")"

      # Stage 6, dynamic half. trivy judged what is *in* the image; this judges
      # how the running image *behaves* on the wire. ZAP's API scan has nothing
      # to crawl on a JSON API, so it learns the attack surface from
      # docs/openapi.yaml - a route missing there is a route never scanned.
      #
      # The gate fails on any WARN or FAIL that .zap/rules.tsv does not accept.
      # That is only stable because the ZAP image is pinned: new ZAP releases
      # add rules, and a floating tag would turn an upstream release into a red
      # pipeline on an unchanged tree. Bump the version deliberately.
      #
      # What this does not cover: the binary frame body. ZAP's active rules
      # attack named parameters, and an octet-stream body has none, so
      # /v1/frames is fuzzed by libFuzzer (fuzzing.yml) instead.
      - name: DAST - ZAP API scan (gate = any unaccepted warning)
        run: |
          docker network create dast
          docker run -d --name ttg --network dast -p 127.0.0.1:8080:8080 ttg:ci

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/readyz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/readyz >/dev/null || {
            echo "::error::gateway did not become ready"; docker logs ttg; exit 1;
          }

          # ZAP runs as an unprivileged user and writes its reports into the
          # mounted directory, so it must be world-writable.
          mkdir -p zap
          cp docs/openapi.yaml .zap/rules.tsv zap/
          chmod -R a+rwX zap

          set +e
          docker run --rm --network dast -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2 \
            zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi \
              -O http://ttg:8080 -c rules.tsv \
              -J zap-report.json -r zap-report.html -s
          status=$?
          set -e

          mkdir -p evidence
          cp zap/zap-report.json zap/zap-report.html evidence/ 2>/dev/null || true

          # A scan that crashed the target would otherwise read as "few
          # findings". The process surviving the attack is part of the verdict.
          if [ "$(docker inspect -f '{{.State.Running}}' ttg)" != "true" ]; then
            echo "::error::the gateway died during the DAST scan"
            docker logs ttg
            exit 1
          fi

          # zap-api-scan.py: 0 = clean, 1 = FAIL, 2 = WARN, 3 = scan error.
          case "$status" in
            0) echo "ZAP: no findings beyond .zap/rules.tsv" ;;
            1|2) echo "::error::ZAP reported findings - see zap-report.html in the image-evidence artefact"; exit 1 ;;
            *) echo "::error::ZAP failed to run (exit $status)"; exit 1 ;;
          esac

      # Stage 6, contract half. Where ZAP replays known attack payloads,
      # Schemathesis generates requests from docs/openapi.yaml - valid ones,
      # boundary values, undeclared methods - and checks every response
      # against the contract: no 5xx, only documented status codes and content
      # types, bodies matching their schemas, 405 + Allow for wrong methods.
      # Exceptions live in schemathesis.toml, each with a reason. Runs against
      # the container the ZAP step started, and again checks it survived.
      - name: API contract fuzzing - Schemathesis (gate = any failure)
        run: |
          mkdir -p evidence
          chmod a+rwx evidence
          docker run --rm --network dast \
            -v "$PWD:/w:ro" -v "$PWD/evidence:/out" -w /tmp \
            schemathesis/schemathesis:4.30.0@sha256:bb9cecfc9ac4058a15fcf9b505d9d9f972e2dde7c74c4e9289a35922f4cbc0a5 \
            --config-file /w/schemathesis.toml \
            run /w/docs/openapi.yaml --url http://ttg:8080 \
            --report junit --report-junit-path /out/schemathesis-junit.xml

          if [ "$(docker inspect -f '{{.State.Running}}' ttg)" != "true" ]; then
            echo "::error::the gateway died during the Schemathesis run"
            docker logs ttg
            exit 1
          fi

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence
          path: |
            evidence/image-sbom.cdx.json
            evidence/grype-image.json
            evidence/zap-report.json
            evidence/zap-report.html
            evidence/schemathesis-junit.xml
          if-no-files-found: ignore

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # Signing and attestation only happen for tags: an unreleased commit has
      # nothing to attest about, and signing every main build would fill the
      # transparency log with artefacts nobody consumes.
      - name: Push, sign and attest (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digest=""
          for tag in $TAGS; do
            docker tag ttg:ci "$tag"
            docker push "$tag"

            # Sign and attest by digest, not by tag. A tag is mutable: signing
            # "latest" says nothing about which image a consumer will pull,
            # while a digest signature is bound to exact bytes.
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$tag" | cut -d@ -f2)
            ref="${tag%%:*}@${digest}"
            echo "signing $ref"

            cosign sign --yes "$ref"

            # The SBOM becomes an in-toto attestation on the image rather than a
            # loose file in an Actions artefact that expires in 90 days. This is
            # the difference between "we generated an SBOM" and "a consumer can
            # verify the SBOM for the image they are about to run".
            #
            # The image SBOM is the one attested here because it describes the
            # thing the digest identifies. The Conan dependency SBOM describes
            # the source build instead, and travels with the release bundle
            # (see release.yml) where its subject is the binary.
            cosign attest --yes --type cyclonedx \
              --predicate evidence/image-sbom.cdx.json "$ref"
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"

      # SLSA build provenance: who built this image, from which commit, with
      # which workflow. Verifiable with `gh attestation verify`.
      - name: Attest build provenance (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verification instructions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="${IMAGE}@${DIGEST}"
          {
            echo '### Signed image'
            echo ''
            echo '```sh'
            echo "# signature"
            echo "cosign verify $image \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo ''
            echo "# SBOM attestation"
            echo "cosign verify-attestation $image --type cyclonedx \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo ''
            echo "# build provenance"
            echo "gh attestation verify oci://$image -R ${{ github.repository }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
