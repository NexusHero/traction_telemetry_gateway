name: Supply chain

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # publish image to GHCR
  id-token: write          # keyless signing

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  sbom-and-scan:
    name: SBOM + dependency CVE gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install "conan>=2.0"

      # CONAN_HOME is cached, so the sbom extension that scripts/sbom.sh
      # installs on first run persists across runs too.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-sbom-${{ hashFiles('conanfile.py') }}

      - name: Resolve dependency graph (conan.lock)
        run: |
          conan profile detect --force
          conan install . --build=missing -of build -s build_type=Release --lockfile-out=build/conan.lock

      # Generated from the Conan graph via the official conan-extensions
      # command - the same script developers run locally, so the SBOM in a
      # release artifact and the one on a dev machine are produced identically.
      - name: Generate SBOM (CycloneDX)
        run: ./scripts/sbom.sh -o build/sbom.cdx.json

      # The CVE gate deliberately does NOT read the SBOM above: the extension
      # emits package URLs but no CPEs, and CPE is what file-based scanners
      # match C/C++ packages on, so scanning it would pass unconditionally.
      # `conan audit` resolves CVEs against the Conan references themselves.
      #
      # The provider needs a (free) token from https://conan.io/audit/register,
      # which must be email-validated before it works. `provider auth` stores a
      # token without checking it, so an invalid one surfaces as a 403 in the
      # scan step below rather than here.
      #
      # Secrets are unavailable to pull requests from forks, where the gate is
      # skipped with a warning rather than failing on something the contributor
      # cannot fix. Anywhere else a missing token is a hard error: a silently
      # skipped gate is worse than no gate.
      - name: Authenticate CVE provider
        id: auth
        env:
          CONAN_AUDIT_TOKEN: ${{ secrets.CONAN_AUDIT_TOKEN }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if [ -n "$CONAN_AUDIT_TOKEN" ]; then
            conan audit provider auth conancenter --token="$CONAN_AUDIT_TOKEN"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning::CONAN_AUDIT_TOKEN unavailable to fork PRs - CVE gate skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CONAN_AUDIT_TOKEN is not set. Register at https://conan.io/audit/register and add it as the repository secret CONAN_AUDIT_TOKEN."
            exit 1
          fi

      # Default severity threshold is CVSS >= 9.0, i.e. critical only, matching
      # the trivy gate on the image below. --context host skips tool requires,
      # which never reach the runtime image.
      - name: Scan dependencies for CVEs (gate = critical)
        if: steps.auth.outputs.enabled == 'true'
        run: |
          conan audit scan . --context host --severity-level 9.0 -s build_type=Release -f json --out-file build/conan-audit.json

      - name: Upload SBOM and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-scan-results
          path: |
            build/sbom.cdx.json
            build/conan.lock
            build/conan-audit.json
          if-no-files-found: ignore

  container:
    name: Container build, scan & sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      # Build into a fixed local tag so the scan below always has a target,
      # regardless of branch/tag (metadata tags differ between PR and push).
      - name: Build image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ttg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image (gate = critical)
        run: trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed ttg:ci

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Push and sign image (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker tag ttg:ci "$tag"
            docker push "$tag"
            cosign sign --yes "$tag"
          done
