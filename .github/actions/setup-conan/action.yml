name: Set up Conan
description: >
  Python, then Conan and the rest of ci/requirements.txt from hashes, then the
  default Conan profile for this runner. The one place this sequence lives:
  it used to be copied into every job that builds, and the copies had already
  started to drift (step names, where the profile was detected).

  Deliberately no dependency cache in here. Whether a job may restore one is a
  per-job security decision - the jobs that produce signed artefacts must not
  (see release.yml, supply-chain.yml) - and it stays visible in the workflow,
  where zizmor's cache-poisoning audit can see it.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install Conan and Python tooling (hash-pinned)
      shell: bash
      run: pip install --require-hashes -r ci/requirements.txt

    - name: Detect default profile
      shell: bash
      run: conan profile detect --force
